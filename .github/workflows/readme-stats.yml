# Generates the profile README images (stats card with Spider-Man, top languages)
# in a dark and a light version, so text stays readable in both GitHub themes.
# Runs daily and on demand ("Run workflow" in the Actions tab).
name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 07:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Epinnn14&show_icons=true&hide_rank=true&hide=stars,issues&hide_title=true&hide_border=true&bg_color=00000000&text_color=8B949E&icon_color=FFC07A
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Epinnn14&show_icons=true&hide_rank=true&hide=stars,issues&hide_title=true&hide_border=true&bg_color=00000000&text_color=57606A&icon_color=C4451A
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Epinnn14&layout=compact&langs_count=6&hide_title=true&hide_border=true&bg_color=00000000&text_color=8B949E
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Epinnn14&layout=compact&langs_count=6&hide_title=true&hide_border=true&bg_color=00000000&text_color=57606A
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hang Spider-Man from the stats card
        run: python3 .github/scripts/compose_about.py

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
